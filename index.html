<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item { animation: fadeIn 0.2s ease-in-out; }
        .task-complete { text-decoration: line-through; opacity: 0.5; }
        
        /* Textbook mode - Japanese notebook style */
        body.textbook-mode {
            background-color: #faf6f1;
            background-image: 
                linear-gradient(90deg, transparent calc(100% - 14.28%), rgba(211, 47, 47, 0.15) calc(100% - 14.28%), rgba(211, 47, 47, 0.15) calc(100% - 12.28%), transparent calc(100% - 12.28%)),
                linear-gradient(0deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 25px;
            font-family: 'Georgia', serif;
        }
        body.textbook-mode::before {
            content: '';
            position: fixed;
            right: calc(14.28% - 8px);
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #d32f2f 0%, #d32f2f 100%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 2px 0 8px rgba(211, 47, 47, 0.3);
        }
        
        /* Dark mode - True blackish dark */
        body.dark-mode {
            background-color: #0f172a !important;
            color: #e2e8f0;
        }
        body.dark-mode .bg-white {
            background-color: #1e293b !important;
        }
        body.dark-mode .text-slate-800 {
            color: #e2e8f0 !important;
        }
        body.dark-mode .text-slate-700 {
            color: #cbd5e1 !important;
        }
        body.dark-mode .text-slate-400 {
            color: #94a3b8 !important;
        }
        body.dark-mode .border-slate-200 {
            border-color: #334155 !important;
        }
        body.dark-mode .border-slate-700 {
            border-color: #334155 !important;
        }
        body.dark-mode .bg-slate-200 {
            background-color: #334155 !important;
        }
        body.dark-mode .bg-slate-700 {
            background-color: #475569 !important;
        }
        body.dark-mode .hover\:bg-slate-100:hover {
            background-color: #334155 !important;
        }
        body.dark-mode .hover\:bg-slate-300:hover {
            background-color: #475569 !important;
        }
        body.dark-mode .hover\:bg-slate-400:hover {
            background-color: #64748b !important;
        }
        body.dark-mode .hover\:bg-slate-600:hover {
            background-color: #475569 !important;
        }
        body.dark-mode .dark-mode\:bg-slate-700 {
            background-color: #475569 !important;
        }
        body.dark-mode .dark-mode\:bg-slate-800 {
            background-color: #1e293b !important;
        }
        body.dark-mode .dark-mode\:text-slate-100 {
            color: #f1f5f9 !important;
        }
        body.dark-mode .dark-mode\:border-slate-700 {
            border-color: #334155 !important;
        }
        body.dark-mode .bg-slate-300 {
            background-color: #475569 !important;
        }
        body.dark-mode .bg-slate-500 {
            background-color: #64748b !important;
        }
        body.dark-mode input {
            background-color: #334155 !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        body.dark-mode input::placeholder {
            color: #94a3b8 !important;
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4 bg-white text-slate-800 transition-colors duration-300">
    <div class="max-w-lg mx-auto">
        <!-- Header -->
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-800 dark-mode:text-slate-100">Todo</h1>
            <div class="flex gap-2">
                <button 
                    id="themeToggle" 
                    class="px-3 py-1 text-xs bg-slate-200 dark-mode:bg-slate-700 hover:bg-slate-300 dark-mode:hover:bg-slate-600 text-slate-800 dark-mode:text-slate-100 rounded transition"
                    title="Toggle theme"
                >
                    🌙
                </button>
                <button 
                    id="textbookToggle" 
                    class="px-3 py-1 text-xs bg-slate-200 dark-mode:bg-slate-700 hover:bg-slate-300 dark-mode:hover:bg-slate-600 text-slate-800 dark-mode:text-slate-100 rounded transition"
                    title="Textbook mode"
                >
                    📖
                </button>
            </div>
        </div>

        <!-- Input -->
        <div class="bg-white dark-mode:bg-slate-800 rounded shadow p-3 mb-4">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add task..." 
                    class="flex-1 px-3 py-2 text-sm border border-slate-200 dark-mode:border-slate-700 dark-mode:bg-slate-700 dark-mode:text-slate-100 rounded focus:outline-none focus:border-blue-500 transition"
                    autocomplete="off"
                >
                <button 
                    id="addBtn" 
                    class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded transition"
                >
                    Add
                </button>
            </div>
        </div>

        <!-- Tasks -->
        <div id="taskList" class="space-y-2">
            <!-- Tasks rendered here -->
        </div>

        <!-- Empty -->
        <div id="emptyState" class="text-center py-8">
            <p class="text-slate-400 text-sm">No tasks yet</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark-mode:bg-slate-800 rounded shadow-lg p-6 max-w-sm w-full">
            <h3 class="text-lg font-bold text-slate-800 dark-mode:text-slate-100 mb-4">Edit task</h3>
            <input 
                type="text" 
                id="editInput" 
                class="w-full px-3 py-2 text-sm border border-slate-200 dark-mode:border-slate-700 dark-mode:bg-slate-700 dark-mode:text-slate-100 rounded focus:outline-none focus:border-blue-500 mb-4"
            >
            <div class="flex gap-2">
                <button id="saveEditBtn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold py-2 rounded transition">Save</button>
                <button id="cancelEditBtn" class="flex-1 bg-slate-300 dark-mode:bg-slate-600 hover:bg-slate-400 dark-mode:hover:bg-slate-500 text-slate-800 dark-mode:text-slate-100 text-sm font-semibold py-2 rounded transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Color Palette Modal -->
    <div id="colorModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark-mode:bg-slate-800 rounded shadow-lg p-5 max-w-xs w-full">
            <h3 class="text-sm font-bold text-slate-800 dark-mode:text-slate-100 mb-3">Color</h3>
            <div class="grid grid-cols-4 gap-2 mb-3">
                <button data-color="bg-red-100" class="w-10 h-10 bg-red-100 rounded hover:ring-2 ring-offset-2 ring-red-400 transition"></button>
                <button data-color="bg-blue-100" class="w-10 h-10 bg-blue-100 rounded hover:ring-2 ring-offset-2 ring-blue-400 transition"></button>
                <button data-color="bg-green-100" class="w-10 h-10 bg-green-100 rounded hover:ring-2 ring-offset-2 ring-green-400 transition"></button>
                <button data-color="bg-yellow-100" class="w-10 h-10 bg-yellow-100 rounded hover:ring-2 ring-offset-2 ring-yellow-400 transition"></button>
                <button data-color="bg-purple-100" class="w-10 h-10 bg-purple-100 rounded hover:ring-2 ring-offset-2 ring-purple-400 transition"></button>
                <button data-color="bg-pink-100" class="w-10 h-10 bg-pink-100 rounded hover:ring-2 ring-offset-2 ring-pink-400 transition"></button>
                <button data-color="bg-orange-100" class="w-10 h-10 bg-orange-100 rounded hover:ring-2 ring-offset-2 ring-orange-400 transition"></button>
                <button data-color="bg-cyan-100" class="w-10 h-10 bg-cyan-100 rounded hover:ring-2 ring-offset-2 ring-cyan-400 transition"></button>
            </div>
            <div class="flex gap-2">
                <button id="randomColorBtn" class="flex-1 bg-slate-500 hover:bg-slate-600 text-white text-sm font-semibold py-1 rounded transition">Random</button>
                <button id="cancelColorBtn" class="flex-1 bg-slate-300 hover:bg-slate-400 text-slate-800 text-sm font-semibold py-1 rounded transition">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        class TodoManager {
            constructor() {
                this.tasks = [];
                this.selectedTaskId = null;
                this.editingTaskId = null;
                this.colors = ['bg-red-100', 'bg-blue-100', 'bg-green-100', 'bg-yellow-100', 'bg-purple-100', 'bg-pink-100', 'bg-orange-100', 'bg-cyan-100'];
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            getRandomColor() {
                return this.colors[Math.floor(Math.random() * this.colors.length)];
            }

            addTask(title) {
                const task = {
                    id: this.generateId(),
                    title: title.trim(),
                    completed: false,
                    color: this.getRandomColor()
                };
                this.tasks.unshift(task);
                return task;
            }

            removeTask(taskId) {
                this.tasks = this.tasks.filter(task => task.id !== taskId);
            }

            toggleTask(taskId) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) task.completed = !task.completed;
            }

            updateTaskColor(taskId, color) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) task.color = color;
            }

            updateTask(taskId, title) {
                const task = this.tasks.find(t => t.id === taskId);
                if (task) task.title = title.trim();
            }

            getSortedTasks() {
                return [...this.tasks].sort((a, b) => {
                    if (a.completed === b.completed) return 0;
                    return a.completed ? 1 : -1;
                });
            }

            getTasks() {
                return this.tasks;
            }
        }

        class UIManager {
            constructor(todoManager) {
                this.todo = todoManager;
                this.taskInput = document.getElementById('taskInput');
                this.addBtn = document.getElementById('addBtn');
                this.taskList = document.getElementById('taskList');
                this.emptyState = document.getElementById('emptyState');
                this.colorModal = document.getElementById('colorModal');
                this.editModal = document.getElementById('editModal');
                this.editInput = document.getElementById('editInput');
                this.themeToggle = document.getElementById('themeToggle');
                this.textbookToggle = document.getElementById('textbookToggle');

                this.attachEventListeners();
                this.loadTheme();
            }

            attachEventListeners() {
                this.addBtn.addEventListener('click', () => this.handleAddTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleAddTask();
                });

                this.themeToggle.addEventListener('click', () => this.toggleDarkMode());
                this.textbookToggle.addEventListener('click', () => this.toggleTextbookMode());

                document.querySelectorAll('#colorModal [data-color]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.todo.updateTaskColor(this.todo.selectedTaskId, btn.dataset.color);
                        this.closeColorModal();
                        this.render();
                    });
                });

                document.getElementById('randomColorBtn').addEventListener('click', () => {
                    this.todo.updateTaskColor(this.todo.selectedTaskId, this.todo.getRandomColor());
                    this.closeColorModal();
                    this.render();
                });

                document.getElementById('cancelColorBtn').addEventListener('click', () => this.closeColorModal());

                document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEdit());
                document.getElementById('cancelEditBtn').addEventListener('click', () => this.closeEditModal());
                this.editInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.saveEdit();
                });
            }

            handleAddTask() {
                const title = this.taskInput.value;
                if (title.trim()) {
                    this.todo.addTask(title);
                    this.taskInput.value = '';
                    this.taskInput.focus();
                    this.render();
                }
            }

            openColorModal(taskId) {
                this.todo.selectedTaskId = taskId;
                this.colorModal.classList.remove('hidden');
            }

            closeColorModal() {
                this.colorModal.classList.add('hidden');
            }

            openEditModal(taskId) {
                const task = this.todo.tasks.find(t => t.id === taskId);
                if (task) {
                    this.todo.editingTaskId = taskId;
                    this.editInput.value = task.title;
                    this.editModal.classList.remove('hidden');
                    setTimeout(() => this.editInput.focus(), 0);
                }
            }

            closeEditModal() {
                this.editModal.classList.add('hidden');
                this.todo.editingTaskId = null;
            }

            saveEdit() {
                const title = this.editInput.value;
                if (title.trim()) {
                    this.todo.updateTask(this.todo.editingTaskId, title);
                    this.closeEditModal();
                    this.render();
                }
            }

            toggleDarkMode() {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            }

            toggleTextbookMode() {
                document.body.classList.toggle('textbook-mode');
                localStorage.setItem('textbookMode', document.body.classList.contains('textbook-mode') ? 'true' : 'false');
            }

            loadTheme() {
                const theme = localStorage.getItem('theme');
                const textbook = localStorage.getItem('textbookMode');
                if (theme === 'dark') document.body.classList.add('dark-mode');
                if (textbook === 'true') document.body.classList.add('textbook-mode');
            }

            render() {
                const tasks = this.todo.getSortedTasks();
                
                if (tasks.length === 0) {
                    this.taskList.innerHTML = '';
                    this.emptyState.classList.remove('hidden');
                    return;
                }

                this.emptyState.classList.add('hidden');
                this.taskList.innerHTML = tasks.map(task => this.createTaskElement(task)).join('');
                this.attachTaskEventListeners();
            }

            createTaskElement(task) {
                return `
                    <div class="task-item ${task.color} rounded shadow p-3 flex items-center gap-2 group hover:shadow-md transition">
                        <button 
                            class="complete-btn flex-shrink-0 w-5 h-5 rounded border border-slate-400 hover:border-slate-600 transition flex items-center justify-center text-xs ${task.completed ? 'bg-slate-600 border-slate-600' : 'hover:bg-slate-100'}"
                            data-id="${task.id}"
                        >
                            ${task.completed ? '✓' : ''}
                        </button>
                        <span 
                            class="task-title flex-1 text-slate-800 text-sm ${task.completed ? 'task-complete' : ''}"
                            data-id="${task.id}"
                            style="cursor: pointer;"
                        >
                            ${this.escapeHtml(task.title)}
                        </span>
                        <button 
                            class="color-btn flex-shrink-0 px-2 py-1 bg-white bg-opacity-60 hover:bg-opacity-100 rounded text-xs opacity-0 group-hover:opacity-100 transition"
                            data-id="${task.id}"
                        >
                            🎨
                        </button>
                        <button 
                            class="delete-btn flex-shrink-0 px-2 py-1 bg-red-100 hover:bg-red-200 text-red-600 rounded text-xs opacity-0 group-hover:opacity-100 transition"
                            data-id="${task.id}"
                        >
                            ✕
                        </button>
                    </div>
                `;
            }

            attachTaskEventListeners() {
                document.querySelectorAll('.complete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.todo.toggleTask(e.currentTarget.dataset.id);
                        this.render();
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.todo.removeTask(e.currentTarget.dataset.id);
                        this.render();
                    });
                });

                document.querySelectorAll('.color-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.openColorModal(e.currentTarget.dataset.id);
                    });
                });

                document.querySelectorAll('.task-title').forEach(el => {
                    el.addEventListener('click', (e) => {
                        this.openEditModal(e.currentTarget.dataset.id);
                    });
                });
            }

            escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        }

        const todoManager = new TodoManager();
        const uiManager = new UIManager(todoManager);
        uiManager.render();
        document.getElementById('taskInput').focus();
    </script>
</body>
</html>
